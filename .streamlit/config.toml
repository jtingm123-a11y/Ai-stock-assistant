[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131E2F"
textColor = "#E5EDF8"
linkColor = "#60A5FA"
borderColor = "#26364D"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "sans-serif"
toolbarMode = "minimal"
baseFontSize = 14
headingFontSizes = ["30px", "23px", "19px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
chartCategoricalColors = ["#F87171", "#34D399", "#60A5FA", "#FBBF24", "#A78BFA", "#22D3EE"]
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
grayColor = "#94A3B8"

[theme.sidebar]
backgroundColor = "#0F1928"
secondaryBackgroundColor = "#16243A"
textColor = "#D8E3F1"
borderColor = "#26364D"
primaryColor = "#60A5FA"

[client]
showSidebarNavigation = false
